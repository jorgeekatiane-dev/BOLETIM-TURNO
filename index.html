<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boletim Turno</title>
<style>body{background:#121212;color:#fff;font-family:Arial;padding:10px}h1{text-align:center;color:#FFD700}.tabs{display:flex;gap:5px;margin-bottom:10px}.tab{flex:1;padding:10px;background:#333;border:none;color:#fff;cursor:pointer;border-radius:5px;font-weight:bold}.tab.active{background:#FFD700;color:#000}.aba{display:none}.aba.active{display:block}.item{background:#1e1e1e;padding:10px;margin-bottom:8px;border-radius:8px}.item b{color:#FFD700}label{display:block;margin:5px 0;font-size:14px}input,select{width:100%;padding:8px;margin-top:3px;border-radius:5px;border:none;background:#2a2a2a;color:#fff}button{width:100%;padding:15px;background:#FFD700;color:#000;font-weight:bold;border:none;border-radius:8px;font-size:16px;cursor:pointer;margin-top:10px}textarea{width:100%;height:200px;background:#1e1e1e;color:#fff;border:1px solid #333;border-radius:8px;padding:10px;margin-top:10px}</style>
</head>
<body>
<h1>BOLETIM DE TURNO</h1>
<label>Turma:<select id="turma"><option>A</option><option>B</option><option>C</option><option>D</option></select></label>
<label>Data:<input type="date" id="data"></label>
<div class="tabs"><button class="tab active" onclick="abrirAba('caminhonete')">CAMINHONETES</button><button class="tab" onclick="abrirAba('caminhao')">CAMINHÕES</button><button class="tab" onclick="abrirAba('adiantamento')">ADIANTAMENTO</button></div>
<div class="aba active" id="caminhonete"></div>
<div class="aba" id="caminhao"></div>
<div class="aba" id="adiantamento"></div>
<button onclick="gerarRelatorio()">GERAR RELATÓRIO</button>
<button onclick="copiar()">COPIAR RELATÓRIO</button>
<textarea id="saida" readonly></textarea>
<script>
const caminhonetes=['CB113','CB114','CB115','CB117','CB118','CB125','CB127','CB128','CB132','CB135','CB138','CB141','CB142','CB143'];
const caminhoes=['CB119','CB120','CB121','CB122','CB123','CB124','CB126','CB130','CB133','CB137','CB140','CB144'];
const lugaresFuros=['PRIORIDADE 1','PRIORIDADE 2','PRIORIDADE 3','PRIORIDADE 4','PRIORIDADE 5','PRIORIDADE 6'];
function abrirAba(id){document.querySelectorAll('.aba').forEach(a=>a.classList.remove('active'));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById(id).classList.add('active');event.target.classList.add('active')}
function criarLista(containerId,lista){const container=document.getElementById(containerId);lista.forEach(cb=>{container.innerHTML+=`<div class="item"><b>${cb}</b><label>Disponibilidade:<select id="disp-${cb}"><option>Apto ✅</option><option>Indisponível ❌</option><option>Manutenção</option></select></label><label>Abastecimento:<select id="abast-${cb}"><option>Abastecido por completo</option><option>Falta abastecer</option><option>Falta completar</option></select></label></div>`})}
function criarFuros(){const container=document.getElementById('adiantamento');lugaresFuros.forEach(lugar=>{const id=lugar.toLowerCase().replace(/\s/g,'');container.innerHTML+=`<div class="item"><label>${lugar} - Adiantamento:<input type="number" id="${id}" placeholder="0"></label></div>`})}
function gerarRelatorio(){const turma=document.getElementById('turma').value;const data=document.getElementById('data').value;const dataFormatada=new Date(data).toLocaleDateString('pt-BR');let texto=`TROCA DE TURNO:\n\nBoa noite, Turma!\nTroca de turno 3×3 Turma (${turma})\n*${dataFormatada}*\n\n`;[...caminhonetes,...caminhoes].forEach(cb=>{const disp=document.getElementById(`disp-${cb}`)?.value;const abast=document.getElementById(`abast-${cb}`)?.value;if(disp&&abast){texto+=`*🚛.${cb}* \n${abast} \n${disp}\n\n`}});texto+=`ADIANTAMENTO\n`;lugaresFuros.forEach(lugar=>{const id=lugar.toLowerCase().replace(/\s/g,'');texto+=`${lugar}: ${document.getElementById(id).value}\n`});texto+=`\n*UM ÓTIMO TURNO DE TRABALHO A TODOS*`;document.getElementById('saida').value=texto}
function copiar(){const saida=document.getElementById('saida');saida.select();document.execCommand('copy');alert('Relatório copiado!')}
document.getElementById('data').valueAsDate=new Date();criarLista('caminhonete',caminhonetes);criarLista('caminhao',caminhoes);criarFuros();
</script>
</body>
</html>
